<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Core Record Dot Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="60%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#D90429" />
    </radialGradient>

    <!-- Screen Outline Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF2D55" flood-opacity="0.45" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2.5" />

  <!-- Outer Pulse Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-dasharray="210 14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Subtle Ring -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="#3F3F46" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Vibrant Center Record Sphere -->
  <circle cx="64" cy="64" r="22" fill="url(#dotGrad)" filter="url(#subtleShadow)" />

  <!-- Lens / Light Specular Highlight -->
  <ellipse cx="58" cy="56" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.65" transform="rotate(-25 58 56)" />

  <!-- Corner Capture Accents (Focus Reticle) -->
  <!-- Top-Left -->
  <path d="M 22 36 L 22 24 A 2 2 0 0 1 24 22 L 36 22" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M 106 36 L 106 24 A 2 2 0 0 0 104 22 L 92 22" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M 22 92 L 22 104 A 2 2 0 0 0 24 106 L 36 106" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M 106 92 L 106 104 A 2 2 0 0 1 104 106 L 92 106" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
</svg>
