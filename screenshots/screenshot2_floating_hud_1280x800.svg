<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="camShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bgGrad)" />

  <!-- Desktop Presentation / Work Screen Mockup -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <!-- Browser/OS Screen Frame -->
    <rect width="1160" height="640" rx="12" fill="#1e1e24" stroke="#334155" stroke-width="2" />

    <!-- Browser top header bar -->
    <rect width="1160" height="42" rx="12" fill="#0f172a" />
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    <rect x="360" y="9" width="440" height="24" rx="6" fill="#1e293b" />
    <text x="580" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">meet.google.com/xyz-abcd-qrs · Product Review Presentation</text>

    <!-- Screen Content: Presentation Slide -->
    <g transform="translate(60, 80)">
      <rect width="700" height="480" rx="8" fill="#090d16" stroke="#1e293b" />
      <text x="60" y="100" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Q4 Product Architecture Review</text>
      <text x="60" y="135" font-family="sans-serif" font-size="15" fill="#94a3b8">Interactive walkthrough of client-side stream recording</text>

      <rect x="60" y="180" width="180" height="110" rx="8" fill="#1e293b" />
      <text x="80" y="215" font-size="20">⚡</text>
      <text x="80" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Zero-Cloud DSP</text>
      <text x="80" y="265" font-family="sans-serif" font-size="10" fill="#94a3b8">100% Local Processing</text>

      <rect x="260" y="180" width="180" height="110" rx="8" fill="#1e293b" />
      <text x="280" y="215" font-size="20">🎬</text>
      <text x="280" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">30fps Canvas PiP</text>
      <text x="280" y="265" font-family="sans-serif" font-size="10" fill="#94a3b8">Smooth Facecam Blending</text>

      <rect x="460" y="180" width="180" height="110" rx="8" fill="#1e293b" />
      <text x="480" y="215" font-size="20">🛡️</text>
      <text x="480" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Crash Recovery</text>
      <text x="480" y="265" font-family="sans-serif" font-size="10" fill="#94a3b8">IndexedDB 1s Chunk Sync</text>
    </g>

    <!-- Circular Webcam Facecam PiP (Bottom-Right of Presentation) -->
    <g transform="translate(640, 390)" filter="url(#camShadow)">
      <circle cx="80" cy="80" r="76" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
      <!-- Face Silhouette / Avatar -->
      <circle cx="80" cy="65" r="30" fill="#38bdf8" />
      <path d="M 40 135 C 40 105, 120 105, 120 135 Z" fill="#38bdf8" />
      <circle cx="80" cy="80" r="76" fill="none" stroke="#ff385c" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Floating SnapRecord HUD Window (Positioned Next to Meeting) -->
    <g transform="translate(820, 60)" filter="url(#shadow)">
      <rect width="300" height="520" rx="12" fill="#121214" stroke="#ff385c" stroke-width="1.5" />

      <!-- Top Status Bar -->
      <g transform="translate(18, 20)">
        <rect width="105" height="24" rx="6" fill="rgba(239, 68, 68, 0.15)" />
        <circle cx="12" cy="12" r="4" fill="#ef4444" />
        <text x="24" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#ef4444">RECORDING</text>
        <text x="264" y="18" font-family="monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">01:24</text>
      </g>

      <!-- Mini Live Screen Preview Video -->
      <g transform="translate(18, 60)">
        <rect width="264" height="300" rx="8" fill="#09090b" stroke="#27272a" />
        <rect x="20" y="40" width="224" height="150" rx="4" fill="#1e293b" />
        <text x="132" y="125" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Live Composite Feed</text>
        <!-- Mini Cam PIP in Preview -->
        <circle cx="210" cy="160" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
      </g>

      <!-- Audio VU Level Meter -->
      <g transform="translate(18, 380)">
        <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="600" fill="#a1a1aa">MIC AUDIO LEVEL (48kHz)</text>
        <rect y="10" width="264" height="6" rx="3" fill="#27272a" />
        <rect y="10" width="185" height="6" rx="3" fill="#10b981" />
      </g>

      <!-- Action Buttons -->
      <g transform="translate(18, 420)">
        <!-- Pause -->
        <rect width="100" height="42" rx="8" fill="#27272a" />
        <text x="50" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⏸️ Pause</text>

        <!-- Stop & Save -->
        <rect x="110" width="154" height="42" rx="8" fill="#e11d48" />
        <text x="187" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⏹️ Finish &amp; Save</text>
      </g>
    </g>
  </g>

  <!-- Top Banner -->
  <g text-anchor="middle" font-family="sans-serif">
    <text x="640" y="55" font-size="28" font-weight="800" fill="#ffffff">Distraction-Free Floating HUD with Facecam PiP</text>
    <text x="640" y="82" font-size="14" fill="#94a3b8">Real-time VU audio meter · Smooth seeking MP4 container · Hardware webcam compositor</text>
  </g>
</svg>