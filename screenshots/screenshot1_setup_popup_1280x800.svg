<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ff385c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff385c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  <rect width="1280" height="800" fill="url(#glowTop)" />

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="640" x2="1280" y2="640" />
    <line x1="256" y1="0" x2="256" y2="800" />
    <line x1="512" y1="0" x2="512" y2="800" />
    <line x1="768" y1="0" x2="768" y2="800" />
    <line x1="1024" y1="0" x2="1024" y2="800" />
  </g>

  <!-- Hero Titles -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Category Pill -->
    <rect x="520" y="36" width="240" height="28" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="640" y="55" font-size="11" font-weight="700" fill="#ff385c" letter-spacing="1">1-CLICK SCREEN &amp; AUDIO RECORDER</text>

    <!-- Main Title -->
    <text x="640" y="105" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Simple, Clean &amp; Distraction-Free</text>
    <text x="640" y="135" font-size="15" font-weight="500" fill="#a1a1aa">High-Definition Screen, Tab &amp; Cam Recording with 100% On-Device Privacy</text>
  </g>

  <!-- Centered Extension Popup Window (Mockup) -->
  <g transform="translate(465, 170)" filter="url(#shadow)">
    <!-- Window Border & Body -->
    <rect width="350" height="540" rx="14" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5" />

    <!-- Window Header -->
    <g transform="translate(18, 20)">
      <!-- Mini Icon -->
      <rect width="28" height="28" rx="7" fill="#ff385c" />
      <circle cx="14" cy="14" r="6" fill="#ffffff" />
      <circle cx="14" cy="14" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

      <!-- Brand text -->
      <text x="36" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">SnapRecord</text>
      <rect x="122" y="4" width="34" height="15" rx="4" fill="rgba(255, 56, 92, 0.18)" />
      <text x="139" y="15" font-family="sans-serif" font-size="9" font-weight="800" fill="#ff385c" text-anchor="middle">LITE</text>
      <text x="314" y="15" font-family="sans-serif" font-size="10" font-weight="600" fill="#71717a" text-anchor="end">v1.0.0</text>
    </g>

    <!-- Segmented Control (Capture Source) -->
    <g transform="translate(18, 62)">
      <rect width="314" height="50" rx="9" fill="#09090b" stroke="#27272a" stroke-width="1" />

      <!-- Tab 1: Screen (Active) -->
      <rect x="3" y="3" width="102" height="44" rx="7" fill="#27272a" />
      <text x="54" y="23" font-size="15" text-anchor="middle">🖥️</text>
      <text x="54" y="39" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Entire Screen</text>

      <!-- Tab 2: Tab -->
      <text x="157" y="23" font-size="15" text-anchor="middle">📑</text>
      <text x="157" y="39" font-family="sans-serif" font-size="10" font-weight="600" fill="#71717a" text-anchor="middle">Current Tab</text>

      <!-- Tab 3: Window -->
      <text x="260" y="23" font-size="15" text-anchor="middle">🪟</text>
      <text x="260" y="39" font-family="sans-serif" font-size="10" font-weight="600" fill="#71717a" text-anchor="middle">Window</text>
    </g>

    <!-- Card 1: Microphone -->
    <g transform="translate(18, 126)">
      <rect width="314" height="52" rx="10" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
      <text x="16" y="32" font-size="18">🎙️</text>
      <text x="44" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Microphone</text>
      <text x="44" y="40" font-family="sans-serif" font-size="10" fill="#a1a1aa">High-Definition Voice (48kHz)</text>
      <!-- Switch ON -->
      <rect x="262" y="16" width="36" height="20" rx="10" fill="#ff385c" />
      <circle cx="288" cy="26" r="7" fill="#ffffff" />
    </g>

    <!-- Card 2: System Audio -->
    <g transform="translate(18, 188)">
      <rect width="314" height="52" rx="10" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
      <text x="16" y="32" font-size="18">🔊</text>
      <text x="44" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">System Audio</text>
      <text x="44" y="40" font-family="sans-serif" font-size="10" fill="#a1a1aa">Tab / Computer Audio</text>
      <!-- Switch ON -->
      <rect x="262" y="16" width="36" height="20" rx="10" fill="#ff385c" />
      <circle cx="288" cy="26" r="7" fill="#ffffff" />
    </g>

    <!-- Card 3: Webcam Facecam -->
    <g transform="translate(18, 250)">
      <rect width="314" height="52" rx="10" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
      <text x="16" y="32" font-size="18">📹</text>
      <text x="44" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">Webcam Facecam</text>
      <text x="44" y="40" font-family="sans-serif" font-size="10" fill="#a1a1aa">Picture-in-Picture Overlay</text>
      <!-- Switch ON -->
      <rect x="262" y="16" width="36" height="20" rx="10" fill="#ff385c" />
      <circle cx="288" cy="26" r="7" fill="#ffffff" />
    </g>

    <!-- Format & Quality Options Row -->
    <g transform="translate(18, 314)">
      <!-- Format Group -->
      <rect width="150" height="58" rx="9" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="9" font-weight="700" fill="#71717a">FORMAT</text>
      <text x="12" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">MP4 (Universal)</text>

      <!-- Quality Group -->
      <rect x="164" width="150" height="58" rx="9" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
      <text x="176" y="20" font-family="sans-serif" font-size="9" font-weight="700" fill="#71717a">QUALITY</text>
      <text x="176" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">1080p HD (60fps)</text>
    </g>

    <!-- Record Action Button -->
    <g transform="translate(18, 388)" filter="url(#btnGlow)">
      <rect width="314" height="48" rx="10" fill="url(#btnGrad)" />
      <circle cx="98" cy="24" r="5" fill="#ffffff" />
      <text x="168" y="29" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Start Recording</text>
    </g>

    <!-- Footer -->
    <g transform="translate(18, 458)" font-family="sans-serif" font-size="10" fill="#71717a">
      <text x="0" y="16">🔒 100% On-Device &amp; Private</text>
      <text x="314" y="16" text-anchor="end">Stop: <tspan font-family="monospace" fill="#a1a1aa">Alt+Shift+S</tspan></text>
    </g>
  </g>

  <!-- Left Feature Highlight Badge -->
  <g transform="translate(120, 320)" font-family="sans-serif">
    <rect width="260" height="150" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" filter="url(#shadow)" />
    <circle cx="36" cy="36" r="16" fill="rgba(16, 185, 129, 0.15)" />
    <text x="36" y="42" font-size="16" text-anchor="middle">⚡</text>
    <text x="64" y="34" font-size="14" font-weight="700" fill="#ffffff">Instant 1-Click Launch</text>
    <text x="64" y="50" font-size="11" fill="#a1a1aa">No account. No watermarks.</text>

    <line x1="20" y1="74" x2="240" y2="74" stroke="#27272a" />

    <text x="24" y="98" font-size="11" font-weight="600" fill="#e4e4e7">✓ Segmented Source Selector</text>
    <text x="24" y="118" font-size="11" font-weight="600" fill="#e4e4e7">✓ Auto Seekable Duration Fix</text>
    <text x="24" y="138" font-size="11" font-weight="600" fill="#e4e4e7">✓ Automatic Crash Recovery</text>
  </g>

  <!-- Right Feature Highlight Badge -->
  <g transform="translate(900, 320)" font-family="sans-serif">
    <rect width="260" height="150" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" filter="url(#shadow)" />
    <circle cx="36" cy="36" r="16" fill="rgba(59, 130, 246, 0.15)" />
    <text x="36" y="42" font-size="16" text-anchor="middle">🎙️</text>
    <text x="64" y="34" font-size="14" font-weight="700" fill="#ffffff">Studio Voice &amp; PiP</text>
    <text x="64" y="50" font-size="11" fill="#a1a1aa">48kHz Audio + Webcam</text>

    <line x1="20" y1="74" x2="240" y2="74" stroke="#27272a" />

    <text x="24" y="98" font-size="11" font-weight="600" fill="#e4e4e7">✓ 48kHz Dynamic Vocal Limiter</text>
    <text x="24" y="118" font-size="11" font-weight="600" fill="#e4e4e7">✓ Circular Camera Overlay</text>
    <text x="24" y="138" font-size="11" font-weight="600" fill="#e4e4e7">✓ Universal MP4 &amp; WebM Export</text>
  </g>
</svg>